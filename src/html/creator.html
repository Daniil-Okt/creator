<div class="creator">
    <div class="creator__fon-left" data-aos="fade-right" data-aos-duration="700" data-aos-delay="300">
        <picture>
            <source media="(max-width: 768px)" srcset="@img/creator-fon1-mob.png">
            <img src="@img/creator-fon1.png" alt="">
        </picture>
    </div>
    <div class="creator__fon-right" data-aos="fade-left" data-aos-duration="700" data-aos-delay="600">
        <picture>
            <source media="(max-width: 768px)" srcset="@img/creator-fon2-mob.png">
            <img src="@img/creator-fon2.png" alt="">
        </picture>
    </div>
    <div class="creator__container">
        <div class="creator__body" data-aos="fade-down" data-aos-duration="700">
            <div class="creator__mark">
                <h1 class="creator__title">
                    $CREATOR
                </h1>
                <p class="creator__text">
                    0x000000000000000000000000000000
                </p>
            </div>
            <div class="about__mark-text">
                <span>0x000000000000000000000000000000</span>
            </div>
            <div class="creator__social social">
                <a href="#">
                    <img src="@img/social1.svg" alt="">
                </a>
                <a href="#">
                    <img src="@img/social2.svg" alt="">
                </a>
                <a href="#">
                    <img src="@img/social3.svg" alt="">
                </a>
                <a href="#">
                    <img src="@img/social4.svg" alt="">
                </a>
                <a href="#">
                    <img src="@img/social5.svg" alt="">
                </a>
            </div>
            <a href="#" class="creator__button button">
                BUY
            </a>
        </div>

        <div class="creator__img" data-da=".creator__body ,768, 1">
            <img src="@img/creator-img.png" alt="">
        </div>
    </div>
</div>
